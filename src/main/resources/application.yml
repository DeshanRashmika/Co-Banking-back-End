spring:
  application:
    name: co-banking-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/co_banking_db
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmProductionChange}
  expiration: 3600000

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:your-client-id.apps.googleusercontent.com}
    verify-url: https://www.googleapis.com/oauth2/v3/tokeninfo

server:
  servlet:
    context-path: /api
  port: 8080
  error:
    include-message: always
    include-stacktrace: on-param

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    edu.icet.banking: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/co_banking_db
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: dev-secret-key-that-is-256-bits-long-change-in-production-environment-now

logging:
  level:
    root: INFO
    edu.icet.banking: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-256-bits-minimum-for-hs256

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3306/co_banking_db
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:your-client-id.apps.googleusercontent.com}

logging:
  level:
    root: WARN
    edu.icet.banking: INFO
